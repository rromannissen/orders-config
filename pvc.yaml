apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orders-source
  labels:
    helm.sh/chart: quickstart-openshift-pipelines-0.1.0
    app.kubernetes.io/name: orders
    app.kubernetes.io/instance: orders
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    konveyor.io/owner: "Stefan Richard"
    konveyor.io/business-service: "Retail"
    konveyor.io/archetype: "Spring Boot"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
