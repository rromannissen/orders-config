    app.kubernetes.io/instance: orders
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    konveyor.io/owner: "Stefan Richard"
    konveyor.io/business-service: "Retail"
    konveyor.io/archetype: "Spring Boot"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
